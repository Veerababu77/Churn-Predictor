<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer churn predictor</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1c2430; --muted:#5d6878; --line:#d9dee5;
          --accent:#1f5eff; --bad:#c62828; --good:#1b7f4b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12161c; --card:#1a2028; --ink:#e8ecf1; --muted:#9aa5b4; --line:#2c3541;
            --accent:#6c95ff; --bad:#ff7b72; --good:#56d39b; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:16px /1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:760px; margin:0 auto; padding:32px 16px 64px; }
  h1 { font-size:1.6rem; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 24px; }
  form { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:20px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:14px 18px; }
  label { display:block; font-size:.9rem; color:var(--muted); margin-bottom:4px; }
  select,input { width:100%; padding:9px 10px; font:inherit; color:var(--ink);
                 background:var(--bg); border:1px solid var(--line); border-radius:6px; }
  select:focus,input:focus,button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  button { margin-top:20px; padding:11px 22px; font:inherit; font-weight:600; color:#fff;
           background:var(--accent); border:0; border-radius:6px; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  #result { margin-top:20px; padding:18px 20px; border-radius:10px; border:1px solid var(--line);
            background:var(--card); display:none; }
  #result .verdict { font-size:1.4rem; font-weight:700; }
  #result .bar { height:8px; background:var(--line); border-radius:4px; margin:10px 0 6px; overflow:hidden; }
  #result .bar span { display:block; height:100%; background:var(--accent); }
  .yes { color:var(--bad); } .no { color:var(--good); }
</style>
</head>
<body>
<main>
  <h1>Customer churn predictor</h1>
  <p class="sub">Enter the customer's details to see whether they are likely to leave.</p>

  <form id="form"><div class="grid" id="grid"></div>
    <button type="submit" id="btn">Predict churn</button></form>

  <div id="result" aria-live="polite">
    <div class="verdict" id="verdict"></div>
    <div class="bar"><span id="fill"></span></div>
    <div id="prob"></div>
  </div>
</main>

<script>
const YN = ["Yes","No"], NI = ["Yes","No","No internet service"];
// name must match the training column; options are the allowed values
const FIELDS = [
  ["Gender",["Male","Female"]], ["Senior Citizen",YN,"No"], ["Partner",YN], ["Dependents",YN],
  ["Tenure Months","number",9], ["Phone Service",YN], ["Multiple Lines",["Yes","No","No phone service"],"No"],
  ["Internet Service",["DSL","Fiber optic","No"]], ["Online Security",NI,"No"], ["Online Backup",NI,"No"],
  ["Device Protection",NI], ["Tech Support",NI], ["Streaming TV",NI], ["Streaming Movies",NI,"No"],
  ["Contract",["Month-to-month","One year","Two year"]], ["Paperless Billing",YN],
  ["Payment Method",["Electronic check","Mailed check","Bank transfer (automatic)","Credit card (automatic)"]],
  ["Monthly Charges","number",70]
];

const grid = document.getElementById("grid");
for (const [name, opts, def] of FIELDS) {
  const wrap = document.createElement("div");
  const id = name.replace(/\s/g, "_");
  let control;
  if (opts === "number") {
    control = `<input id="${id}" name="${name}" type="number" min="0" step="any" value="${def}" required>`;
  } else {
    control = `<select id="${id}" name="${name}">` +
      opts.map(o => `<option${o === def ? " selected" : ""}>${o}</option>`).join("") + `</select>`;
  }
  wrap.innerHTML = `<label for="${id}">${name}</label>${control}`;
  grid.appendChild(wrap);
}

document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("btn");
  const payload = {};
  for (const [name, opts] of FIELDS) {
    const v = document.getElementById(name.replace(/\s/g, "_")).value;
    payload[name] = opts === "number" ? Number(v) : v;
  }
  btn.disabled = true; btn.textContent = "Predicting...";
  const box = document.getElementById("result"), verdict = document.getElementById("verdict");
  try {
    const res = await fetch("/predict", { method:"POST",
      headers:{ "Content-Type":"application/json" }, body: JSON.stringify(payload) });
    if (!res.ok) throw new Error("The server rejected the input (" + res.status + "). Check the values and try again.");
    const data = await res.json();
    const pct = (data.probability * 100).toFixed(1);
    verdict.className = "verdict " + (data.churn === "Yes" ? "yes" : "no");
    verdict.textContent = data.churn === "Yes" ? "Likely to churn" : "Likely to stay";
    document.getElementById("fill").style.width = pct + "%";
    document.getElementById("prob").textContent = "Churn probability: " + pct + "%";
  } catch (err) {
    verdict.className = "verdict yes";
    verdict.textContent = err.message.startsWith("The server") ? err.message
      : "Could not reach the API. Is uvicorn running?";
    document.getElementById("fill").style.width = "0";
    document.getElementById("prob").textContent = "";
  }
  box.style.display = "block";
  btn.disabled = false; btn.textContent = "Predict churn";
});
</script>
</body>
</html>
